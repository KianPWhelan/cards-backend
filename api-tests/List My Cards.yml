info:
  name: List My Cards
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}/cards?search=speedy"
  params:
    - name: search
      value: speedy
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: userId
      value: 6ad923e6946b6ecf29ec23d2
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns an array of your cards", function () {
          expect(body).to.be.an("array");
          body.forEach((card) => expect(card.userId).to.equal(bru.getVar("userId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lists the logged-in user's cards. Remove the search parameter to list them all.
